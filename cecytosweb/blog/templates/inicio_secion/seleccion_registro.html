{% extends 'base_registro.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="text-center mb-3">Crear cuenta</h3>
                <p class="text-center text-muted">Elige qué tipo de cuenta necesitas:</p>

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">¿Qué eres?</label>
                        <select name="respuesta" class="form-select" required>
                            <option value="">-- Selecciona una opción --</option>
                            <option value="alumno">Soy Alumno</option>
                            <option value="profesor">Soy Profesor</option>
                            <option value="admin">Soy Admin</option>
                            <option value="tutor">Soy Tutor</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Continuar</button>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
