<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Rol - SIAA</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
   
</head>
<body class="d-flex flex-column justify-content-center py-5">

    <div class="container">
       
        <div class="mb-4">
            <a href="{% url 'inicio_sesion' %}" class="btn btn-light shadow-sm rounded-pill px-4">
                <i class="bi bi-arrow-left me-1"></i> Regresar
            </a>
        </div>

        <!-- Título -->
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark">¿Cómo deseas registrarte?</h1>
        </div>

        <!-- Tarjetas de Roles -->
        <div class="row g-4 justify-content-center">
            <!-- Alumno -->
            <div class="col-md-4">
                <div class="card h-100 shadow-sm role-card text-center p-4">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <h3 class="card-title fw-bold mb-4">Alumno</h3>
                        <a href="{% url 'registrar_alumno' %}" class="btn btn-primary btn-lg w-100 rounded-3">
                            Registrarme como Alumno
                        </a>
                    </div>
                </div>
            </div>

            <!-- Docente -->
            <div class="col-md-4">
                <div class="card h-100 shadow-sm role-card text-center p-4">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <h3 class="card-title fw-bold mb-4">Docente</h3>
                        <a href="{% url 'registrar_docente' %}" class="btn btn-success btn-lg w-100 rounded-3">
                            Registrarme como Docente
                        </a>
                    </div>
                </div>
            </div>

            <!-- Tutor -->
            <div class="col-md-4">
                <div class="card h-100 shadow-sm role-card text-center p-4">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <h3 class="card-title fw-bold mb-4">Tutor</h3>
                        <a href="{% url 'registrar_tutor' %}" class="btn btn-warning text-dark fw-semibold btn-lg w-100 rounded-3">
                            Registrarme como Tutor
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
