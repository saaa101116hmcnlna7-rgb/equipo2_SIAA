<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegación superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Mi Sitio</a>
            
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="navbar-text text-white me-3">
                        Hola, <strong>{{ user.username }}</strong>
                    </span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Cerrar sesión</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Iniciar sesión</a>
                    <a href="{% url 'registro' %}" class="btn btn-primary btn-sm">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <hr class="my-0">

    <!-- Contenedor principal para el contenido dinámico (ej. formulario de registro) -->
    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- JS de Bootstrap 5 -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
