<div class="table-responsive">
    <table class="table align-middle mb-0">
        <thead>
            <tr><th>Fecha de falta</th><th>Motivo</th><th>Estado</th><th>Comprobante</th></tr>
        </thead>
        <tbody>
            {% for j in justificantes %}
                <tr>
                    <td>{{ j.fecha_falta|date:"d/m/Y" }}</td>
                    <td>{{ j.motivo }}</td>
                    <td>
                        <span class="badge {% if j.estado == 'aprobado' %}text-bg-success{% elif j.estado == 'rechazado' %}text-bg-danger{% else %}text-bg-warning{% endif %}">
                            {{ j.get_estado_display }}
                        </span>
                    </td>
                    <td>
                        {% if j.comprobante %}<a href="{% url 'comprobante' j.pk %}">Descargar</a>{% else %}-{% endif %}
                    </td>
                </tr>
            {% empty %}
                <tr><td colspan="4" class="text-center text-muted">No hay justificantes.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
