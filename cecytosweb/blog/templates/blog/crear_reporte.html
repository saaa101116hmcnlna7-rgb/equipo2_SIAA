{% extends 'blog/base.html' %}

{% block title %}Nuevo reporte{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-crema shadow p-4">
            <h3 class="fw-bold mb-4">Nuevo reporte</h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% include 'blog/_campos.html' %}
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-cecytos">Guardar</button>
                    <a href="{% url 'panel_maestro' %}" class="btn btn-outline-dark rounded-pill px-4">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
