{% extends 'blog/base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-crema shadow p-4">
            <h3 class="text-center fw-bold mb-4">Iniciar sesión</h3>
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                {% include 'blog/_campos.html' %}
                <button type="submit" class="btn btn-cecytos w-100 mt-4">Entrar</button>
            </form>
            <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
        </div>
    </div>
</div>
{% endblock %}
