{% extends 'blog/base.html' %}
{% load static %}

{% block content %}
<div class="card bg-dark border-info text-white rounded-4 p-4 shadow">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">HORARIO DE CLASES</h3>
            <small class="text-info">Semestre: Tercero | Grupo: 306 | Turno: Vespertino</small>
        </div>
        <a href="{% url 'panel_alumno' %}" class="btn btn-outline-light rounded-pill btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>

  
    <div class="text-center bg-white p-2 rounded-3">
        <img src="{% static 'blog/img/horario_306.jpg' %}" 
             alt="Horario de clases Grupo 306" 
             class="img-fluid rounded shadow-sm">
    </div>

    <div class="text-center mt-3">
        <a href="{% static 'blog/img/horario_306.png' %}" target="_blank" class="btn btn-cecytos btn-sm">
            <i class="bi bi-zoom-in me-1"></i>Ver en pantalla completa
        </a>
    </div>
</div>
{% endblock %}
